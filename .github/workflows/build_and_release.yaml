
name: Build and release Aseprite

on:
  push:
    branches:
      - main
    paths:
      - 'BuildLog.md'

  workflow_dispatch:
    inputs:
      publish:
        description: Publish GitHub Release
        type: boolean
        required: true
        default: true

      os:
        description: Choose build operating system
        type: choice
        required: true
        default: windows-latest
        options:
          - windows-latest
          - ubuntu-latest
          - macOS-latest

permissions:
  contents: write

jobs:
  fetch-aseprite-info:
    name: Get latest Aseprite version
    runs-on: ubuntu-latest

    outputs:
      release-tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Get latest release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/aseprite/aseprite/releases/latest \
            | jq -r '.tag_name // empty')"

          if [[ -z "$tag" ]]; then
            echo "Could not find the latest Aseprite release."
            exit 1
          fi

          echo "Latest Aseprite version: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: fetch-aseprite-info

    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}

    steps:
      - name: Create release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          name: Aseprite ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          body: Aseprite ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-aseprite:
    name: Build Aseprite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    needs:
      - fetch-aseprite-info
      - create-release

    if: >-
      ${{
        always() &&
        needs.fetch-aseprite-info.result == 'success' &&
        (
          needs.create-release.result == 'success' ||
          (
            github.event_name == 'workflow_dispatch' &&
            !inputs.publish &&
            needs.create-release.result == 'skipped'
          )
        )
      }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.os)) || fromJSON('["windows-latest","ubuntu-latest","macOS-latest"]') }}

    steps:
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            g++ \
            clang \
            cmake \
            ninja-build \
            unzip \
            curl \
            git \
            zip \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libwebp-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          brew update
          brew install cmake ninja

      - name: Checkout Aseprite source
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --recurse-submodules \
            --branch "$RELEASE_TAG" \
            https://github.com/aseprite/aseprite.git \
            aseprite

      - name: Configure Visual Studio
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Install Ninja on Windows
        if: runner.os == 'Windows'
        uses: aseprite/get-ninja@main

      - name: Automatically build Aseprite on Windows
        if: runner.os == 'Windows'
        working-directory: aseprite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Starting Aseprite automatic build..."

          # build.cmd invokes the official build.ps1 and build.sh scripts.
          # NUL prevents the final pause from waiting for keyboard input.
          cmd.exe /d /c "build.cmd --auto --norun < NUL"

          $executable = Join-Path $PWD "build\bin\aseprite.exe"

          if (!(Test-Path $executable)) {
            throw "Aseprite build failed. The executable was not generated."
          }

          Write-Host "Aseprite was built successfully."

      - name: Automatically build Aseprite on Linux
        if: runner.os == 'Linux'
        working-directory: aseprite
        shell: bash
        run: |
          set -euo pipefail

          chmod +x build.sh

          echo "Starting Aseprite automatic build..."

          ./build.sh --auto --norun

          test -f build/bin/aseprite

          echo "Aseprite was built successfully."

      - name: Automatically build Aseprite on macOS
        if: runner.os == 'macOS'
        working-directory: aseprite
        shell: bash
        run: |
          set -euo pipefail

          chmod +x build.sh

          echo "Starting Aseprite automatic build..."

          ./build.sh --auto --norun

          test -f build/bin/aseprite

          echo "Aseprite was built successfully."

      - name: Verify Windows build files
        if: runner.os == 'Windows'
        working-directory: aseprite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $bin = Join-Path $PWD "build\bin"

          if (!(Test-Path "$bin\aseprite.exe")) {
            throw "aseprite.exe is missing."
          }

          if (!(Test-Path "$bin\data")) {
            throw "Aseprite data directory is missing."
          }

          Write-Host "Checking OpenSSL dependencies..."

          $dependencies = & dumpbin /dependents "$bin\aseprite.exe" 2>&1

          $dependencies | Out-Host

          Write-Host "Windows build files verified."

      - name: Package Windows build
        if: runner.os == 'Windows'
        working-directory: aseprite
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          $bin = Join-Path $PWD "build\bin"
          $archive = "Aseprite-$env:RELEASE_TAG-Windows.zip"
          $destination = Join-Path $env:RUNNER_TEMP $archive

          Compress-Archive `
            -Path "$bin\*" `
            -DestinationPath $destination `
            -CompressionLevel Optimal `
            -Force

          Move-Item $destination $bin -Force

          Write-Host "Created $archive"

      - name: Package Linux build
        if: runner.os == 'Linux'
        working-directory: aseprite/build/bin
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
        run: |
          set -euo pipefail

          archive="Aseprite-$RELEASE_TAG-Linux.zip"

          zip -r "$RUNNER_TEMP/$archive" .
          mv "$RUNNER_TEMP/$archive" .

          echo "Created $archive"

      - name: Package macOS build
        if: runner.os == 'macOS'
        working-directory: aseprite/build/bin
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
        run: |
          set -euo pipefail

          archive="Aseprite-$RELEASE_TAG-macOS.zip"

          zip -r "$RUNNER_TEMP/$archive" .
          mv "$RUNNER_TEMP/$archive" .

          echo "Created $archive"

      - name: Upload test artifact
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}
          path: aseprite/build/bin/Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload GitHub Release asset
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aseprite/build/bin/Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}.zip
          asset_name: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}.zip
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          overwrite: true
