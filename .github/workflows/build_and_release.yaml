
name: Build and release Aseprite

on:
  push:
    branches:
      - main
    paths:
      - 'BuildLog.md'

  workflow_dispatch:
    inputs:
      publish:
        description: Publish GitHub Release
        type: boolean
        required: true
        default: true

      os:
        description: Choose build operating system
        type: choice
        required: true
        default: windows-latest
        options:
          - windows-latest
          - ubuntu-latest
          - macOS-latest

env:
  BUILD_TYPE: Release

jobs:
  fetch-aseprite-info:
    name: Fetch Aseprite version
    runs-on: ubuntu-latest

    outputs:
      release-tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Fetch latest Aseprite release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/aseprite/aseprite/releases/latest \
            | jq -r '.tag_name // empty')"

          if [[ -z "$tag" ]]; then
            echo "Could not find the latest Aseprite release." >&2
            exit 1
          fi

          echo "Aseprite release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: fetch-aseprite-info

    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}

    permissions:
      contents: write

    steps:
      - name: Create release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          name: Aseprite ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          body: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-aseprite:
    name: Build Aseprite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    needs:
      - fetch-aseprite-info
      - create-release

    if: >-
      ${{
        always() &&
        needs.fetch-aseprite-info.result == 'success' &&
        (
          needs.create-release.result == 'success' ||
          (
            github.event_name == 'workflow_dispatch' &&
            !inputs.publish &&
            needs.create-release.result == 'skipped'
          )
        )
      }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.os)) || fromJSON('["windows-latest","ubuntu-latest","macOS-latest"]') }}

    steps:
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y \
            clang \
            g++ \
            cmake \
            ninja-build \
            curl \
            jq \
            unzip \
            zip \
            libpixman-1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            zlib1g-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libssl-dev \
            libzstd-dev

      - name: Checkout Aseprite source
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            --branch "$RELEASE_TAG" \
            https://github.com/aseprite/aseprite.git \
            aseprite

      - name: Install Skia
        working-directory: aseprite
        shell: bash
        run: |
          set -euo pipefail

          # Aseprite's script expects the build configuration argument.
          skia_url="$(bash laf/misc/skia-url.sh Release)"

          if [[ -z "$skia_url" ]]; then
            echo "Could not determine the Skia download URL." >&2
            exit 1
          fi

          echo "Skia download URL: $skia_url"

          mkdir -p skia

          skia_file="skia/$(basename "$skia_url")"

          curl -fL --retry 3 \
            -o "$skia_file" \
            "$skia_url"

          unzip -q "$skia_file" -d skia

          echo "Skia downloaded and extracted."

      - name: Install Ninja
        uses: aseprite/get-ninja@main

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Configure and generate build files
        working-directory: aseprite
        shell: bash
        run: |
          set -euo pipefail

          skia_arch=x64

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            machine="$(uname -m)"

            if [[ "$machine" == "arm64" ]]; then
              skia_arch=arm64
            else
              skia_arch=x64
            fi
          fi

          skia_dir="$(realpath skia)"
          skia_library_dir="$(realpath "skia/out/Release-$skia_arch")"

          if [[ ! -d "$skia_library_dir" ]]; then
            echo "Skia library directory is missing: $skia_library_dir" >&2
            exit 1
          fi

          cmake_args=(
            -S .
            -B build
            -G Ninja
            "-DCMAKE_BUILD_TYPE=$BUILD_TYPE"
            -DENABLE_TESTS=OFF
            -DENABLE_I18N_STRINGS=ON
            -DENABLE_SCRIPTING=ON
            -DENABLE_CCACHE=OFF
            -DLAF_BACKEND=skia
            "-DSKIA_DIR=$skia_dir"
            "-DSKIA_LIBRARY_DIR=$skia_library_dir"
          )

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            export CC=clang
            export CXX=clang++

            cmake_args+=(
              "-DCMAKE_CXX_FLAGS:STRING=-stdlib=libstdc++"
              "-DCMAKE_EXE_LINKER_FLAGS:STRING=-stdlib=libstdc++"
              -DOPENSSL_USE_STATIC_LIBS=OFF
            )
          fi

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cmake_args+=(
              "-DCMAKE_OSX_ARCHITECTURES=$skia_arch"
            )

            if [[ "$skia_arch" == "arm64" ]]; then
              cmake_args+=(
                -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
              )
            else
              cmake_args+=(
                -DCMAKE_OSX_DEPLOYMENT_TARGET=10.14
              )
            fi
          fi

          cmake "${cmake_args[@]}"

      - name: Compile Aseprite
        working-directory: aseprite
        shell: bash
        run: |
          set -euo pipefail

          cmake --build build \
            --target aseprite \
            --parallel 2

      - name: Verify executable
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            executable="aseprite.exe"
          else
            executable="aseprite"
          fi

          if [[ ! -f "$executable" ]]; then
            echo "Aseprite executable was not generated." >&2
            exit 1
          fi

          echo "Found $executable"

          if [[ ! -d "data" ]]; then
            echo "Aseprite data directory was not generated." >&2
            exit 1
          fi

      - name: Create portable configuration
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          set -euo pipefail

          echo '# Portable Aseprite configuration' > aseprite.ini

      - name: Create Windows ZIP
        if: runner.os == 'Windows'
        working-directory: aseprite/build/bin
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          $archive = "Aseprite-$env:RELEASE_TAG-Windows.zip"
          $tempArchive = Join-Path $env:RUNNER_TEMP $archive

          Compress-Archive `
            -Path * `
            -DestinationPath $tempArchive `
            -CompressionLevel Optimal `
            -Force

          Move-Item $tempArchive $archive -Force

      - name: Create Linux ZIP
        if: runner.os == 'Linux'
        working-directory: aseprite/build/bin
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
        run: |
          set -euo pipefail

          archive="Aseprite-$RELEASE_TAG-Linux.zip"

          zip -r "$RUNNER_TEMP/$archive" .
          mv "$RUNNER_TEMP/$archive" .

      - name: Create macOS ZIP
        if: runner.os == 'macOS'
        working-directory: aseprite/build/bin
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
        run: |
          set -euo pipefail

          archive="Aseprite-$RELEASE_TAG-macOS.zip"

          ditto -c -k --sequesterRsrc --keepParent \
            "$GITHUB_WORKSPACE/aseprite/build/bin" \
            "$RUNNER_TEMP/$archive"

          mv "$RUNNER_TEMP/$archive" .

      - name: Upload test artifact
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}-${{ runner.arch }}-attempt${{ github.run_attempt }}
          path: aseprite/build/bin/Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload release asset
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aseprite/build/bin/Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}.zip
          asset_name: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}.zip
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          overwrite: true
