
name: Build and release Aseprite

on:
  push:
    branches:
      - main
    paths:
      - 'BuildLog.md'

  workflow_dispatch:
    inputs:
      publish:
        description: Publish GitHub Release
        type: boolean
        required: true
        default: true

      os:
        description: Choose build operating system
        type: choice
        required: true
        default: windows-latest
        options:
          - windows-latest
          - ubuntu-latest
          - macOS-latest

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  fetch-aseprite-info:
    name: Fetch Aseprite version
    runs-on: ubuntu-latest

    outputs:
      release-tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Get latest Aseprite release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/aseprite/aseprite/releases/latest \
            | jq -r '.tag_name // empty')"

          if [[ -z "$tag" ]]; then
            echo "Could not determine the latest Aseprite release." >&2
            exit 1
          fi

          echo "Using Aseprite version: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: fetch-aseprite-info

    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}

    permissions:
      contents: write

    steps:
      - name: Create release if it does not exist
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          name: Aseprite ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          body: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-aseprite:
    name: Build Aseprite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    needs:
      - fetch-aseprite-info
      - create-release

    if: >-
      ${{
        always() &&
        needs.fetch-aseprite-info.result == 'success' &&
        (
          needs.create-release.result == 'success' ||
          (
            github.event_name == 'workflow_dispatch' &&
            !inputs.publish &&
            needs.create-release.result == 'skipped'
          )
        )
      }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.os)) || fromJSON('["windows-latest","ubuntu-latest","macOS-latest"]') }}

    steps:
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y \
            clang \
            g++ \
            cmake \
            ninja-build \
            unzip \
            zip \
            libpixman-1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            zlib1g-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libssl-dev \
            libzstd-dev

      - name: Checkout Aseprite source
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            --branch "$RELEASE_TAG" \
            https://github.com/aseprite/aseprite.git \
            aseprite

      - name: Install Skia
        working-directory: aseprite
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            this_dir="$(cygpath "$GITHUB_WORKSPACE/aseprite")"
          else
            this_dir="$GITHUB_WORKSPACE/aseprite"
          fi

          skia_url="$(source "$this_dir/laf/misc/skia-url.sh" | xargs)"

          if [[ -z "$skia_url" ]]; then
            echo "Could not determine the correct Skia download URL." >&2
            exit 1
          fi

          echo "Downloading Skia from:"
          echo "$skia_url"

          skia_file="$(basename "$skia_url")"

          curl -fL --retry 3 \
            -o "$skia_file" \
            "$skia_url"

          unzip -q "$skia_file" -d skia

          test -d skia

      - name: Install Ninja
        uses: aseprite/get-ninja@main

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure and generate build files
        working-directory: aseprite
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            skia_arch=arm64
          else
            skia_arch=x64
          fi

          cmake_args=(
            -S .
            -B build
            -G Ninja
            "-DCMAKE_BUILD_TYPE=$BUILD_TYPE"
            -DENABLE_TESTS=OFF
            -DENABLE_I18N_STRINGS=ON
            -DENABLE_SCRIPTING=ON
            -DENABLE_CCACHE=OFF
            -DLAF_BACKEND=skia
            "-DSKIA_DIR=$(realpath skia)"
            "-DSKIA_LIBRARY_DIR=$(realpath "skia/out/Release-$skia_arch")"
          )

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            export CC=clang
            export CXX=clang++

            cmake_args+=(
              "-DCMAKE_CXX_FLAGS:STRING=-stdlib=libstdc++"
              "-DCMAKE_EXE_LINKER_FLAGS:STRING=-stdlib=libstdc++"
              -DOPENSSL_USE_STATIC_LIBS=OFF
            )
          fi

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cmake_args+=(
              -DCMAKE_OSX_ARCHITECTURES=arm64
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            )
          fi

          cmake "${cmake_args[@]}"

      - name: Compile Aseprite
        working-directory: aseprite/build
        shell: bash
        run: |
          set -euo pipefail
          ninja

      - name: Clean build output
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          set -euo pipefail

          find . -mindepth 1 -maxdepth 1 \
            ! -name 'aseprite' \
            ! -name 'aseprite.exe' \
            ! -name 'data' \
            ! -name 'Aseprite.app' \
            -exec rm -rf -- {} +

      - name: Verify bundled translations
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          set -euo pipefail

          data_dir=data

          if [[ "$RUNNER_OS" == "macOS" ]] &&
             [[ -d "Aseprite.app/Contents/Resources/data" ]]; then
            data_dir="Aseprite.app/Contents/Resources/data"
          fi

          strings_dir="$data_dir/strings.git"

          if [[ ! -d "$strings_dir" ]]; then
            echo "Translation directory not found: $strings_dir" >&2
            exit 1
          fi

          translation_found=false

          for translation in "$strings_dir"/*.ini; do
            if [[ -f "$translation" ]] &&
               [[ "${translation##*/}" != "en.ini" ]] &&
               grep -Eq '^[[:space:]]*\[[^]]+\]' "$translation"; then
              translation_found=true
              break
            fi
          done

          if [[ "$translation_found" != true ]]; then
            echo "No non-English translation content found." >&2
            exit 1
          fi

          rm -rf "$strings_dir/.git"

      - name: Create portable configuration
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RUNNER_OS" == "macOS" ]] &&
             [[ -d "Aseprite.app/Contents/MacOS" ]]; then
            echo '# Portable Aseprite configuration' \
              > Aseprite.app/Contents/MacOS/aseprite.ini
          else
            echo '# Portable Aseprite configuration' > aseprite.ini
          fi

      - name: Create Windows ZIP
        if: runner.os == 'Windows'
        working-directory: aseprite/build/bin
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          $archive = "Aseprite-$env:RELEASE_TAG-Windows.zip"
          $tempArchive = Join-Path $env:RUNNER_TEMP $archive

          Compress-Archive `
            -Path * `
            -DestinationPath $tempArchive `
            -CompressionLevel Optimal `
            -Force

          Move-Item $tempArchive $archive -Force

      - name: Create Linux ZIP
        if: runner.os == 'Linux'
        working-directory: aseprite/build/bin
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
        run: |
          set -euo pipefail

          archive="Aseprite-$RELEASE_TAG-Linux.zip"

          zip -r "$RUNNER_TEMP/$archive" .
          mv "$RUNNER_TEMP/$archive" .

      - name: Create macOS ZIP
        if: runner.os == 'macOS'
        working-directory: aseprite/build/bin
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
        run: |
          set -euo pipefail

          archive="Aseprite-$RELEASE_TAG-macOS.zip"

          if [[ -d "Aseprite.app" ]]; then
            ditto -c -k --sequesterRsrc --keepParent \
              Aseprite.app \
              "$RUNNER_TEMP/$archive"
          else
            zip -r "$RUNNER_TEMP/$archive" .
          fi

          mv "$RUNNER_TEMP/$archive" .

      - name: Upload validation artifact
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}-${{ runner.arch }}-attempt${{ github.run_attempt }}
          path: aseprite/build/bin/Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload release asset
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aseprite/build/bin/Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}.zip
          asset_name: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}.zip
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          overwrite: true
