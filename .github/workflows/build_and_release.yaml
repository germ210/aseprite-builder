
name: Build and release Aseprite

on:
  push:
    branches:
      - main
    paths:
      - 'BuildLog.md'

  workflow_dispatch:
    inputs:
      publish:
        description: Publish GitHub Release
        type: boolean
        required: true
        default: true

      os:
        description: Choose build operating system
        type: choice
        required: true
        default: windows-latest
        options:
          - windows-latest
          - ubuntu-latest
          - macOS-latest

env:
  BUILD_TYPE: Release

jobs:
  fetch-aseprite-info:
    name: Fetch deps info
    runs-on: ubuntu-latest

    outputs:
      download-link: ${{ steps.aseprite-link.outputs.download-link }}
      release-tag: ${{ steps.aseprite-link.outputs.release-tag }}

    steps:
      - name: Fetch Aseprite release link
        id: aseprite-link
        uses: a1393323447/fetch-release@main
        with:
          group: aseprite
          repo: aseprite
          match: Aseprite-.*?-Source.zip

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: fetch-aseprite-info

    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          body: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-aseprite:
    name: Build Aseprite

    needs:
      - fetch-aseprite-info
      - create-release

    if: >-
      ${{
        !cancelled() &&
        needs.fetch-aseprite-info.result == 'success' &&
        (
          needs.create-release.result == 'success' ||
          (
            github.event_name == 'workflow_dispatch' &&
            !inputs.publish &&
            needs.create-release.result == 'skipped'
          )
        )
      }}

    permissions:
      contents: write

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.os)) || fromJSON('["windows-latest","ubuntu-latest","macOS-latest"]') }}

    steps:
      - name: Install Dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libpixman-1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            zlib1g-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libssl-dev \
            libzstd-dev \
            zip

      - name: Checkout workflow repository
        uses: actions/checkout@v7

      - name: Install Aseprite
        shell: bash
        run: |
          git clone \
            --recurse-submodules \
            -j8 \
            --branch "${{ needs.fetch-aseprite-info.outputs.release-tag }}" \
            https://github.com/aseprite/aseprite.git \
            aseprite

      - name: Install Skia
        working-directory: aseprite
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            choco install wget -y --no-progress

            wget https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip

            unzip Skia-Windows-Release-x64.zip -d skia

          elif [[ "${{ runner.os }}" == "macOS" ]]; then

            wget https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-macOS-Release-arm64.zip

            unzip Skia-macOS-Release-arm64.zip -d skia

          else

            wget https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Linux-Release-x64.zip

            unzip Skia-Linux-Release-x64.zip -d skia

          fi

      - uses: aseprite/get-ninja@main

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Generating Makefiles
        shell: bash
        working-directory: aseprite
        run: |
          export enable_ccache=off
          export laf_backend=skia
          export enable_scripting=on

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            export skia_arch=arm64
          else
            export skia_arch=x64
          fi

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.9 \
            -DENABLE_TESTS=OFF \
            -DENABLE_I18N_STRINGS=ON \
            -DENABLE_SCRIPTING=$enable_scripting \
            -DENABLE_CCACHE=$enable_ccache \
            -DLAF_BACKEND=$laf_backend \
            -DSKIA_DIR=$(realpath skia) \
            -DOPENSSL_USE_STATIC_LIBS=OFF \
            -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-$skia_arch)

      - name: Compiling
        shell: bash
        working-directory: aseprite
        run: |
          cd build
          ninja

      - name: Clean Up Build folder
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name 'aseprite' \
            ! -name 'aseprite.exe' \
            ! -name 'data' \
            ! -name 'Aseprite.app' \
            -exec rm -rf -- {} +

      - name: Verify bundled translations
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          data_dir=data

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            data_dir=Aseprite.app/Contents/Resources/data
          fi

          strings_dir="$data_dir/strings.git"

          translation_found=false

          for translation in "$strings_dir"/*.ini; do
            if [[ "${translation##*/}" != en.ini && -f "$translation" ]] &&
               grep -Eq '^[[:space:]]*\[[^]]+\]' "$translation"; then
              translation_found=true
              break
            fi
          done

          if [[ "$translation_found" != true ]]; then
            echo "No non-English translation content found in $strings_dir" >&2
            exit 1
          fi

          # Keep translations and licensing files; omit only Git metadata.
          rm -rf "$strings_dir/.git"

      - name: Make portable zip
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          echo '# This file is here so Aseprite behaves as a portable program' > aseprite.ini

      - name: Create ZIP archive
        if: runner.os == 'Windows'
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          7z -tzip a "Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}.zip" *

      - name: Create ZIP archive
        if: runner.os == 'Linux'
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          zip -r "Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}.zip" .

      - name: Package and verify macOS archive
        if: runner.os == 'macOS'
        timeout-minutes: 10
        working-directory: aseprite/build/bin
        shell: bash
        env:
          ARCHIVE_NAME: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}.zip
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/package-macos.sh" "$ARCHIVE_NAME"

      - name: Upload validation artifact
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}-${{ runner.arch }}-attempt${{ github.run_attempt }}
          path: aseprite/build/bin/Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aseprite/build/bin/Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}.zip
          asset_name: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}.zip
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
